name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Publish only when version.txt has a version that has not been released yet
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build APK
        if: steps.version.outputs.release == 'true'
        run: ./gradlew assembleRelease

      - name: Rename APK
        if: steps.version.outputs.release == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk SubscriptionTracker-${{ env.VERSION }}.apk

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Subscription Tracker ${{ env.VERSION }}
          body: Tap the .apk below on your phone to download and install it.
          files: SubscriptionTracker-${{ env.VERSION }}.apk
          make_latest: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests
